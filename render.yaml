services:
  - type: web
    name: application-livre-api-mariustime88
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "4000"
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FEDAPAY_ENVIRONMENT
        value: sandbox
      - key: FEDAPAY_SECRET_KEY
        sync: false
